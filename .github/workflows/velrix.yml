name: Velrix Auto Renew & Checkin

on:
  # 手动触发
  workflow_dispatch:
  # 定时触发：北京时间每天凌晨 3 点 (对应 UTC 时间每天 19:00)
  schedule:
    - cron: '0 19 * * *'

jobs:
  run-velrix:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 运行签到与续期脚本
      - name: Run Velrix script
        env:
          VELRIX_SESSION: ${{ secrets.VELRIX_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python velrix.py
